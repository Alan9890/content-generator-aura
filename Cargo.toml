[package]
name = "video_recreator_agent"
version = "0.1.0"
edition = "2021"
description = "Agente ultra-ligero en Rust con UI embebida y Bot de Telegram para descargar, analizar y recrear videos con IA"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
uuid = { version = "1.10", features = ["v4"] }
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
